<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodCare - Loading Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif;
        }
        body {
            height: 100vh;
            background: #06080c;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .loader-card {
            width: 100%;
            max-width: 440px;
            background: #12161f;
            border: 1px solid #1e2533;
            border-radius: 16px;
            text-align: center;
            padding: 36px 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        .drop-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: rgba(230, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #e60000;
        }
        .logo {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .logo span {
            color: #e60000;
        }
        .tagline {
            color: #8b95a5;
            font-size: 0.85rem;
            margin-bottom: 28px;
        }
        .loading-box {
            width: 100%;
            margin-bottom: 24px;
        }
        .loading-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: #d1d5db;
            font-weight: 600;
        }
        .percentage {
            color: #e60000;
            font-weight: 700;
        }
        .progress {
            width: 100%;
            height: 6px;
            background: #06080c;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #1e2533;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #e60000;
            border-radius: 10px;
            transition: width 0.05s ease;
        }
        .action-btn {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 8px;
            background: #e60000;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: background 0.2s ease;
        }
        .action-btn:hover {
            background: #b30000;
        }
        .bottom-text {
            position: fixed;
            bottom: 20px;
            color: #4b5563;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="loader-card">
        <div class="drop-icon">
            <i class="fa-solid fa-droplet"></i>
        </div>
        <div class="logo">
            Blood<span>Care</span>
        </div>
        <div class="tagline">
            Every drop. Every donor. Every life.
        </div>

        <div class="loading-box" id="loadingBox">
            <div class="loading-text">
                <span id="statusMessage">Connecting Emergency Grid...</span>
                <span class="percentage" id="percentage">0%</span>
            </div>
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <button class="action-btn" id="launchBtn" onclick="finishLoading()">
            <i class="fa-solid fa-arrow-right"></i> Launch Platform
        </button>
    </div>

    <div class="bottom-text">
        24/7 NATIONAL EMERGENCY BLOOD DISPATCH
    </div>

    <script>
        let percentage = 0;
        const percentageText = document.getElementById("percentage");
        const progressBar = document.getElementById("progressBar");
        const statusMessage = document.getElementById("statusMessage");

        const timer = setInterval(function() {
            percentage += 2;
            if (percentage < 35) {
                statusMessage.innerText = "Initializing BloodCare Network...";
            } else if (percentage < 70) {
                statusMessage.innerText = "Connecting Verified Donors...";
            } else if (percentage < 95) {
                statusMessage.innerText = "Synchronizing Blood Banks...";
            } else if (percentage >= 100) {
                percentage = 100;
                statusMessage.innerText = "Emergency Grid Online";
                clearInterval(timer);
                setTimeout(finishLoading, 400);
            }
            percentageText.innerText = percentage + "%";
            progressBar.style.width = percentage + "%";
        }, 30);

        function finishLoading() {
            window.location.href = "home.html";
        }
    </script>
</body>
</html>
