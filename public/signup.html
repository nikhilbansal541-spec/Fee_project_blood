<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodCare - Create Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #06080c;
            --card: #12161f;
            --card-hover: #181d29;
            --red: #e60000;
            --muted: #8b95a5;
            --border: #1e2533;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Roboto, Arial, sans-serif;
        }
        body {
            width: 100%;
            min-height: 100vh;
            background: var(--bg);
            color: #fff;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            background: rgba(230, 0, 0, 0.12);
            filter: blur(100px);
            top: 10%;
            left: 10%;
            border-radius: 50%;
            pointer-events: none;
        }
        .navbar {
            height: 76px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            background: rgba(6, 8, 12, 0.95);
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 10;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.35rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
        }
        .logo i {
            color: var(--red);
            font-size: 1.45rem;
            filter: drop-shadow(0 0 8px var(--red));
        }
        .back-btn {
            color: #fff;
            text-decoration: none;
            padding: 8px 18px;
            border: 1px solid var(--red);
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: var(--red);
            box-shadow: 0 0 16px rgba(230, 0, 0, 0.4);
        }
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
            position: relative;
            z-index: 5;
        }
        .login-card {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 35px 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        .login-icon {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(230, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 1.7rem;
            color: var(--red);
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 6px;
            font-weight: 800;
        }
        h1 span {
            color: var(--red);
        }
        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #d1d5db;
        }
        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-box i.input-icon {
            position: absolute;
            left: 14px;
            color: var(--muted);
            font-size: 0.95rem;
        }
        .input-box input, .input-box select {
            width: 100%;
            height: 48px;
            padding: 0 14px 0 42px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-box input:focus, .input-box select:focus {
            border-color: var(--red);
            box-shadow: 0 0 10px rgba(230, 0, 0, 0.25);
        }
        .toggle-password {
            position: absolute;
            right: 14px;
            color: var(--muted);
            cursor: pointer;
        }
        .login-btn {
            width: 100%;
            height: 48px;
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }
        .login-btn:hover {
            background: #b30000;
            box-shadow: 0 0 18px rgba(230, 0, 0, 0.5);
            transform: translateY(-2px);
        }
        #message {
            margin-top: 14px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }
        #message.success {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #10b981;
        }
        .register-text {
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
            font-size: 0.85rem;
        }
        .register-text a {
            color: var(--red);
            text-decoration: none;
            font-weight: 700;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="home.html" class="logo">
            <i class="fa-solid fa-droplet"></i>
            BloodCare
        </a>
        <a href="home.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
    </header>

    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1>Join <span>BloodCare.</span></h1>
            <p class="subtitle">Create an account to donate or request blood in emergency</p>
            <form id="signupForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <div class="input-box">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="name" placeholder="Enter your full name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-box">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="blood">Blood Group</label>
                    <div class="input-box">
                        <i class="fa-solid fa-droplet input-icon"></i>
                        <select id="blood" required>
                            <option value="A+">A+ (A Positive)</option>
                            <option value="A-">A- (A Negative)</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="O+" selected>O+ (O Positive)</option>
                            <option value="O-">O-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="city">City / Location</label>
                    <div class="input-box">
                        <i class="fa-solid fa-location-dot input-icon"></i>
                        <input type="text" id="city" placeholder="e.g. Chandigarh / Mohali" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="Create a password (min 6 chars)" required>
                        <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>
                <button type="submit" class="login-btn">
                    <i class="fa-solid fa-check"></i> Register Account
                </button>
            </form>
            <div id="message"></div>
            <p class="register-text">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>
        </div>
    </main>

    <script>
        const password = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        togglePassword.addEventListener("click", function () {
            if (password.type === "password") {
                password.type = "text";
                togglePassword.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                password.type = "password";
                togglePassword.classList.replace("fa-eye-slash", "fa-eye");
            }
        });

        document.getElementById("signupForm").addEventListener("submit", function (e) {
            e.preventDefault();
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const blood = document.getElementById("blood").value;
            const city = document.getElementById("city").value.trim();
            const message = document.getElementById("message");

            const newUser = {
                id: 'USR-' + Math.floor(1000 + Math.random() * 9000),
                name: name,
                email: email,
                bloodGroup: blood,
                city: city,
                role: 'donor'
            };

            localStorage.setItem('bloodcare_user', JSON.stringify(newUser));
            message.className = "success";
            message.innerText = `Registration successful! Welcome ${name}. Redirecting...`;
            setTimeout(function() {
                window.location.href = "home.html";
            }, 1200);
        });
    </script>
</body>
</html>
